:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#161e27; --ink:#e8edf2; --muted:#93a1b0; --rule:#2a3541; --soft:#202a35; --plot:#111921;
  --accent:#d7e3ef; --onaccent:#0f151c;

  --accent:#d7e3ef; --onaccent:#0f151c;
  --cC:#9db0c4; --cCh:#d7e3ef; --cH:#46576a; --cHs:#2c3a49; --bond:#6a7b8d; --ring:#7fb4e6; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);margin:0;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.app{max-width:980px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:12px;min-height:0}
h1{font-size:1.15rem;font-weight:700;margin:0;letter-spacing:.02em}
.top{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.95rem;color:var(--ink);background:var(--panel);border:1px solid var(--rule);
  padding:8px 14px;border-radius:8px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.seg button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.seg.sizes button{min-width:92px;text-align:center}
.sizes small{display:block;font-size:.72rem;opacity:.75}
.stage{position:relative;flex:1;min-height:300px;background:var(--plot);border:1px solid var(--rule);border-radius:10px;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas:active{cursor:grabbing}
.cap{position:absolute;left:14px;top:12px;pointer-events:none}
.cap b{display:block;font-size:1.15rem}
.cap span{font-size:.82rem;color:var(--muted)}
</style>

var $=function(i){return document.getElementById(i);};

function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function buildSizes(){
  var b=$('sizes');b.innerHTML='';
  [4,5,6,7,8].forEach(function(n){
    var e=document.createElement('button');e.type='button';e.setAttribute('data-n',n);
    e.innerHTML='C'+n+'<small>'+NAMES[n]+'</small>';b.appendChild(e);});
}
function buildConfs(){
  var b=$('confs');b.innerHTML='';
  DATA[st.n].forEach(function(c,k){
    var e=document.createElement('button');e.type='button';e.setAttribute('data-i',k);e.textContent=c.name;b.appendChild(e);});
}
function press(){
  Array.prototype.forEach.call($('sizes').children,function(e){e.setAttribute('aria-pressed',+e.getAttribute('data-n')===st.n?'true':'false');});
  Array.prototype.forEach.call($('confs').children,function(e){e.setAttribute('aria-pressed',+e.getAttribute('data-i')===st.i?'true':'false');});
  var c=DATA[st.n][st.i];
  $('capName').textContent=c.name;$('capSub').textContent=NAMES[st.n]+'(C'+st.n+'H'+(2*st.n)+')';
}
function load(){
  var c=DATA[st.n][st.i],n=st.n,at=[],bd=[],i,j;
  for(i=0;i<n;i++)at.push({p:c.C[i],c:1});
  for(i=0;i<2*n;i++)at.push({p:c.H[i],c:0});
  for(i=0;i<n;i++){bd.push([i,(i+1)%n,1]);bd.push([i,n+2*i,0]);bd.push([i,n+2*i+1,0]);}
  M={at:at,bd:bd};
}
function select(n,i){
  if(n!==st.n){st.n=n;buildConfs();}
  st.i=i;st.rx=0.35;st.ry=0.6;load();press();draw();
}
function resize(){
  var r=$('stage').getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);

function draw(){
  if(!M||!W)return;
  var x=cx;x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  var cr=Math.cos(st.rx),sr=Math.sin(st.rx),cy=Math.cos(st.ry),sy=Math.sin(st.ry);
  var S=Math.min(W,H)/(6.2)*st.zoom,D=14,i,q=[];
  for(i=0;i<M.at.length;i++){
    var p=M.at[i].p,x1=p[0]*cy+p[2]*sy,z1=-p[0]*sy+p[2]*cy,y1=p[1];
    var y2=y1*cr-z1*sr,z2=y1*sr+z1*cr,f=D/(D-z2);
    q.push({x:W/2+x1*f*S,y:H/2-y2*f*S,z:z2,f:f,c:M.at[i].c});
  }
  var items=[];
  M.bd.forEach(function(b){var a=q[b[0]],c=q[b[1]];items.push({t:0,z:(a.z+c.z)/2,a:a,b:c,r:b[2]});});
  q.forEach(function(a){items.push({t:1,z:a.z,a:a});});

      var a=it.a,rad=(a.c?0.34:0.21)*S*a.f;

/* 操作: ドラッグで回転、ホイールとピンチで拡大縮小 */
var ptr={},pd=0;

function pdist(){var k=Object.keys(ptr);if(k.length<2)return 0;var a=ptr[k[0]],b=ptr[k[1]];return Math.hypot(a[0]-b[0],a[1]-b[1]);}
cv.addEventListener('pointermove',function(e){
  var o=ptr[e.pointerId];if(!o)return;var k=Object.keys(ptr);
  if(k.length>=2){ptr[e.pointerId]=[e.clientX,e.clientY];var d=pdist();if(pd>0&&d>0)st.zoom=Math.max(.5,Math.min(3,st.zoom*d/pd));pd=d;}
  else{st.ry+=(e.clientX-o[0])*0.01;st.rx=Math.max(-1.5,Math.min(1.5,st.rx+(e.clientY-o[1])*0.01));ptr[e.pointerId]=[e.clientX,e.clientY];}
  draw();
});
function up(e){delete ptr[e.pointerId];pd=pdist();}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',function(e){e.preventDefault();st.zoom=Math.max(.5,Math.min(3,st.zoom*Math.exp(-e.deltaY*0.001)));draw();},{passive:false});

$('confs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)select(st.n,+b.getAttribute('data-i'));});
